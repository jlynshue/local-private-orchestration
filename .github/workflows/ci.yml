# CI for jlynshue/local-private-orchestration
#
# Backs the "Tests-182 passing" badge in the root README. GitHub Actions only
# executes workflows located at the REPOSITORY ROOT (.github/workflows/), so the
# pre-existing privacy-agent/.github/workflows/ci.yml never ran. This root-level
# workflow runs the project's real test suite from the privacy-agent/ subdir.
#
# Real commands come from privacy-agent/Makefile + pyproject.toml:
#   install : pip install -e ".[dev,extractors]"   (PEP 621 project, src/ layout)
#   tests   : pytest tests/ --ignore=tests/redteam --ignore=tests/perf  (152 unit+integration)
#   redteam : pytest tests/redteam/                                     (25 invariant gate)
#   lint    : ruff check src/ tests/ hooks/        (ruff is the only linter configured;
#                                                   black is NOT configured in pyproject)
#
# Scoped OUT of the gating run (kept conservative so CI genuinely passes):
#   - tests/perf/  : these WRITE bench/baseline.json and are timing-sensitive; run
#                    non-gating in a separate job so a slow runner can't fail the build.
# python-magic needs the libmagic system library on Linux -> installed via apt.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: privacy-agent

jobs:
  test:
    name: pytest (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libmagic (required by python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1
        working-directory: .

      - name: Install project + dev/extractor deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,extractors]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ hooks/

      - name: Unit + integration tests
        run: pytest tests/ -q --ignore=tests/redteam --ignore=tests/perf

      - name: Red-team invariant gate
        run: pytest tests/redteam/ -q

      - name: CLI smoke
        run: |
          mkdir -p "$HOME/.privacy-agent"
          privacy-cli audit verify
          privacy-cli canary seed --dir /tmp/ci-canaries --count 2
          privacy-cli canary list --dir /tmp/ci-canaries

  perf:
    # Non-gating: perf baselines are timing-sensitive on shared runners.
    name: perf-baselines (non-gating)
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libmagic (required by python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1
        working-directory: .

      - name: Install project + dev/extractor deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,extractors]"

      - name: Run perf baselines
        run: pytest tests/perf/ -q -s
