[project]
name = "${AGENT_NAME_KEBAB}"
version = "0.1.0-alpha"
description = "${AGENT_DESCRIPTION}"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "tomli>=2.0; python_version<'3.11'",
    "mcp>=1.0,<2.0",
]

[project.scripts]
__AGENT_NAME_KEBAB__ = "__AGENT_NAME_SNAKE__.server:main"
__AGENT_NAME_KEBAB__-cli = "__AGENT_NAME_SNAKE__.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]
filterwarnings = [
    "ignore:builtin type SwigPy.*has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
