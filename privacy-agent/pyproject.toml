[project]
name = "privacy-agent"
version = "0.1.0-alpha"
description = "Privacy-preserving local orchestration MCP daemon"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "tomli>=2.0; python_version<'3.11'",
    "mcp>=1.0",
]

[project.scripts]
privacy-agent = "privacy_agent.server:main"
privacy-cli = "privacy_agent.cli:main"

[project.optional-dependencies]
extractors = [
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-magic>=0.4.27",
]
encryption = [
    "sqlcipher3-binary>=0.5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
