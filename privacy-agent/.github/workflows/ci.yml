name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,extractors]"

      - name: Lint
        run: ruff check src/ tests/ hooks/

      - name: Unit + integration tests
        run: pytest tests/ -q --ignore=tests/redteam --ignore=tests/perf

      - name: Red-team harness (M1.9 invariant gate)
        run: pytest tests/redteam/ -q

      - name: CLI smoke
        run: |
          mkdir -p $HOME/.privacy-agent
          privacy-cli audit verify
          privacy-cli canary seed --dir /tmp/ci-canaries --count 2
          privacy-cli canary list --dir /tmp/ci-canaries

  perf:
    name: perf-baselines
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,extractors]"

      - name: Run baselines
        run: pytest tests/perf/ -q -s

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline
          path: bench/baseline.json
          if-no-files-found: warn

      - name: Compare against committed baseline
        run: python scripts/compare_baselines.py bench/baseline.json
        continue-on-error: true
